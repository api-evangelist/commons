aid: commons
name: Commons
description: 'Commons is an Oakland, California consumer climate-fintech company founded
  in 2018 by Sanchali Seth Pal and operated under the name Joro until its March 2023
  rebrand. Its free iOS and Android app connects a user''s bank accounts and credit
  cards through Plaid and runs every transaction through a proprietary carbon-estimation
  engine, the Carbonizer, which translates dollars spent into an estimate of kilograms
  of CO2e, alongside budgeting, savings goals, expert-reviewed sustainable brand ratings,
  a rewards program, monthly community challenges and an optional paid offset membership.
  The company has raised roughly USD 13.9 million across three rounds from investors
  including Sequoia Capital and Amasia. Commons is a direct-to-consumer mobile product
  rather than an API vendor: thecommons.earth is a Webflow marketing site with no developer
  portal, no API reference and no machine-readable contract, its brand directory and
  member exchange run on Next.js and Softr respectively, and its only public GitHub
  organization, CommonsTech, holds a single 2023 repository publishing carbon-offset
  provider evaluations rather than code.'
